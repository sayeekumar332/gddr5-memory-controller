name: branch-name

on:
  pull_request:
    branches: [main]

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Require a feature-style source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Source branch: $HEAD_REF"
          if ! echo "$HEAD_REF" | grep -Eq '^(feature|fix|docs|test|refactor|chore)/[A-Za-z0-9._-]+$'; then
            echo "Pull requests into main must come from feature/*, fix/*, docs/*, test/*, refactor/* or chore/* branches."
            exit 1
          fi
