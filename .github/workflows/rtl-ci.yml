name: rtl-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-sim:
    name: lint-and-sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python3 -m pip install cocotb pytest
      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          python3 -c "import importlib.metadata as m; print('cocotb', m.version('cocotb'))"
      - name: Lint (Verilator, Verilog-2005)
        run: make lint
      - name: Verilog testbenches (Icarus, -g2005)
        run: make sim
      - name: cocotb tests (Icarus)
        run: make cocotb
